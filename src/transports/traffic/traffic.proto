// Transmission Protocol
//
// Traffic messages are transmitted over a TCP connection established
// between a traffic transport instance and a client application. The
// traffic transport supports a signle client conenction. Each message
// is transmitted using length prefix framing, where the length of the
// message is sent as an unsigned 32-bit integer value (4 bytes) in
// network byte order preceding the transmission of the serialized
// message. The length prefix framing exists outside the Google
// Protocol Buffers specification and is used to delineate message
// boundaries in a data stream.

syntax = "proto2";

package EMANEMessage;

option optimize_for = SPEED;

message Traffic
{
  enum Type
  {
    TYPE_UPSTREAM = 1;
    TYPE_DOWNSTREAM = 2;
  }

  required Type type = 1;
  required string source = 2;
  required string destination = 3;
  required uint64 sequence_number = 4;
  required uint32 priority = 5;
  optional string local = 6;
  required uint32 ttl = 7;
  required bytes payload = 8;
}
